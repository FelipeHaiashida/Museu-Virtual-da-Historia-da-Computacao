<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Admin — MVHC</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <style>
    .admin-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: rgba(7,9,26,.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
      z-index: 900;
    }

    .admin-nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: .9rem;
      letter-spacing: .12em;
      color: var(--text);
      text-decoration: none;
      transition: color var(--transition);
    }
    .admin-nav-logo:hover { color: var(--cyan); }

    .admin-nav-badge {
      font-size: .55rem;
      background: rgba(12,255,225,.1);
      border: 1px solid rgba(12,255,225,.3);
      color: var(--cyan);
      padding: 3px 10px;
      border-radius: 100px;
      font-family: var(--font-display);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .admin-nav-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .admin-user {
      font-size: .83rem;
      color: var(--text-muted);
    }

    .admin-wrapper {
      min-height: 100vh;
      padding: calc(var(--nav-h) + 48px) 0 80px;
    }

    .admin-header {
      margin-bottom: 40px;
    }

    .admin-title {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
      letter-spacing: -.01em;
    }

    .admin-subtitle {
      font-size: .95rem;
      color: var(--text-muted);
    }

    /* Stats */
    .admin-stats {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      text-align: center;
      transition: border-color var(--transition);
    }
    .stat-card:hover { border-color: rgba(12,255,225,.3); }

    .stat-num {
      display: block;
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--cyan), var(--violet2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .stat-label {
      font-family: var(--font-display);
      font-size: .58rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* Filtros */
    .admin-filter {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .filter-label {
      font-family: var(--font-display);
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-right: 4px;
    }

    .filter-btn {
      font-family: var(--font-display);
      font-size: .6rem;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 5px 14px;
      cursor: pointer;
      transition: all var(--transition);
    }
    .filter-btn:hover, .filter-btn.active {
      color: var(--cyan);
      border-color: var(--cyan);
      background: rgba(12,255,225,.06);
    }

    /* Lista */
    .admin-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .admin-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      animation: fb-slide-in .3s ease both;
      transition: border-color var(--transition);
    }
    .admin-card:hover { border-color: rgba(12,255,225,.25); }

    .admin-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .admin-nome {
      font-weight: 500;
      color: var(--text);
      font-size: .95rem;
    }

    .admin-categoria {
      font-family: var(--font-display);
      font-size: .54rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--cyan);
      background: rgba(12,255,225,.08);
      border: 1px solid rgba(12,255,225,.2);
      border-radius: 100px;
      padding: 3px 10px;
    }

    .admin-data {
      font-size: .75rem;
      color: var(--text-dim);
      margin-left: auto;
    }

    .admin-msg {
      font-size: .9rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .admin-empty {
      text-align: center;
      padding: 80px 24px;
    }
    .admin-empty-icon { font-size: 2.5rem; margin-bottom: 16px; opacity: .5; }

    @media (max-width: 600px) {
      .admin-nav { padding: 0 16px; }
      .admin-user { display: none; }
    }
  </style>
</head>
<body>

  <!-- Loader inicial -->
  <div id="admin-loader" class="auth-loader">
    <div class="auth-loader-inner">
      <span class="auth-loader-icon">⬡</span>
      <div class="loader-spinner"></div>
      <p class="loader-text">Carregando painel…</p>
    </div>
  </div>

  <!-- Conteúdo (oculto até auth confirmar) -->
  <div id="admin-content" class="hidden">

    <nav class="admin-nav">
      <a href="index.html" class="admin-nav-logo">
        <span class="logo-icon">⬡</span>
        <span>MVHC</span>
        <span class="admin-nav-badge">Admin</span>
      </a>
      <div class="admin-nav-right">
        <span class="admin-user" id="admin-user-name"></span>
        <button onclick="adminLogout()" class="btn-ghost" style="padding:7px 16px;font-size:.62rem">Sair</button>
      </div>
    </nav>

    <div class="admin-wrapper">
      <div class="container">

        <div class="admin-header">
          <div class="section-label">Painel</div>
          <h1 class="admin-title">Feedbacks do <span class="gradient-text">Museu</span></h1>
          <p class="admin-subtitle">Todos os feedbacks enviados pelos visitantes em tempo real.</p>
        </div>

        <div class="admin-stats" id="admin-stats">
          <div class="stat-card">
            <span class="stat-num" id="stat-total">—</span>
            <span class="stat-label">Total</span>
          </div>
        </div>

        <div class="admin-filter">
          <span class="filter-label">Filtrar:</span>
          <button class="filter-btn active" onclick="filterFeedbacks('', this)">Todos</button>
          <button class="filter-btn" onclick="filterFeedbacks('design', this)">Design</button>
          <button class="filter-btn" onclick="filterFeedbacks('conteudo', this)">Conteúdo</button>
          <button class="filter-btn" onclick="filterFeedbacks('usabilidade', this)">Usabilidade</button>
          <button class="filter-btn" onclick="filterFeedbacks('desempenho', this)">Desempenho</button>
          <button class="filter-btn" onclick="filterFeedbacks('sugestao', this)">Sugestões</button>
          <button class="filter-btn" onclick="filterFeedbacks('outro', this)">Outro</button>
        </div>

        <div id="admin-list" class="admin-list"></div>

      </div>
    </div>

  </div>

  <script type="module">
    import { initializeApp }      from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey:            "AIzaSyACU2e2XRbrVH4_iYjF9_memwqxcxBvTzg",
      authDomain:        "mvhc-d8cde.firebaseapp.com",
      projectId:         "mvhc-d8cde",
      storageBucket:     "mvhc-d8cde.firebasestorage.app",
      messagingSenderId: "520624726072",
      appId:             "1:520624726072:web:801b9ede2d99dec62186cd",
      measurementId:     "G-3VH596CJLF"
    };

    const app          = initializeApp(firebaseConfig);
    const auth         = getAuth(app);
    const db           = getFirestore(app);
    const feedbacksRef = collection(db, "feedbacks");

    const LABELS = {
      design: "Design Visual", conteudo: "Conteúdo Histórico",
      usabilidade: "Usabilidade", desempenho: "Desempenho",
      sugestao: "Sugestão de Melhoria", outro: "Outro"
    };

    let allFeedbacks  = [];
    let activeFilter  = "";

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function renderList(feedbacks) {
      const container = document.getElementById("admin-list");
      if (!container) return;

      if (!feedbacks.length) {
        container.innerHTML = `
          <div class="admin-empty">
            <div class="admin-empty-icon">💬</div>
            <p style="color:var(--text-muted)">Nenhum feedback encontrado${activeFilter ? " para essa categoria" : ""}.</p>
          </div>`;
        return;
      }

      container.innerHTML = feedbacks.map(fb => `
        <div class="admin-card">
          <div class="admin-card-header">
            <span class="admin-nome">${escapeHtml(fb.nome)}</span>
            <span class="admin-categoria">${LABELS[fb.categoria] || fb.categoria}</span>
            <span class="admin-data">${fb.data}</span>
          </div>
          <p class="admin-msg">${escapeHtml(fb.msg)}</p>
        </div>`).join("");
    }

    function updateStats(feedbacks) {
      const counts = {};
      feedbacks.forEach(fb => { counts[fb.categoria] = (counts[fb.categoria] || 0) + 1; });

      const extras = Object.entries(LABELS)
        .filter(([k]) => counts[k])
        .map(([k, v]) => `
          <div class="stat-card">
            <span class="stat-num">${counts[k]}</span>
            <span class="stat-label">${v}</span>
          </div>`).join("");

      document.getElementById("admin-stats").innerHTML = `
        <div class="stat-card">
          <span class="stat-num">${feedbacks.length}</span>
          <span class="stat-label">Total</span>
        </div>${extras}`;
    }

    window.filterFeedbacks = (cat, btn) => {
      activeFilter = cat;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderList(cat ? allFeedbacks.filter(fb => fb.categoria === cat) : allFeedbacks);
    };

    window.adminLogout = async () => {
      await signOut(auth);
      window.location.href = "index.html";
    };

    onAuthStateChanged(auth, user => {
      const loader  = document.getElementById("admin-loader");
      const content = document.getElementById("admin-content");

      if (!user) {
        window.location.href = "index.html";
        return;
      }

      loader?.classList.add("hidden");
      content?.classList.remove("hidden");

      const nameEl = document.getElementById("admin-user-name");
      if (nameEl) nameEl.textContent = user.displayName || user.email;

      const q = query(feedbacksRef, orderBy("timestamp", "desc"));
      onSnapshot(q, snapshot => {
        allFeedbacks = snapshot.docs.map(doc => {
          const d = doc.data();
          return {
            id:        doc.id,
            nome:      d.nome      || "Anônimo",
            categoria: d.categoria || "",
            msg:       d.msg       || "",
            data:      d.timestamp?.toDate()?.toLocaleString("pt-BR", {
              day: "2-digit", month: "2-digit", year: "numeric",
              hour: "2-digit", minute: "2-digit"
            }) || ""
          };
        });

        updateStats(allFeedbacks);
        renderList(activeFilter ? allFeedbacks.filter(fb => fb.categoria === activeFilter) : allFeedbacks);
      }, err => console.error("Firestore:", err));
    });
  </script>

</body>
</html>
